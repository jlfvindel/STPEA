# -------------------------------------------------------------
#  myst.yml · Sitio de la asignatura STPEA (planificación y teoría)
#  Ver en local:   myst start
#  Publicar:       ../../construir-arbol.sh (toda la asignatura), o solo
#                  este sitio: BASE_URL=/ruta/del/curso/stpea-curso ./publicar.sh
#
#  Los ejemplos se publican aparte, en la carpeta hermana
#  ejemplos-myst/. Las páginas los enlazan como /ejemplos-myst/…;
#  publicar.sh genera las redirecciones que llevan hasta ellos.
# -------------------------------------------------------------
version: 1

project:
  title: Soporte Tecnológico a Procesos de Enseñanza y Aprendizaje
  short_title: STPEA
  authors:
    - name: José Luis Fernández Vindel
  license: CC-BY-4.0

  toc:
    - file: index.md
    - file: bloques/espacio-propio.md
    - file: bloques/contenidos-y-actividades.md
    - file: bloques/tutorizacion.md

site:
  template: book-theme
  nav:
    - title: Ejemplos MyST
      url: /ejemplos-myst
  options:
    logo: img/logo.svg
    logo_text: STPEA
    favicon: img/logo.svg
